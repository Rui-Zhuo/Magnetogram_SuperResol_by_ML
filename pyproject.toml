[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magnetosr"
version = "0.1.0"
description = "Reproducible HMI to Hinode/SP magnetogram reconstruction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23,<3", "scipy>=1.10", "torch>=2.2", "scikit-image>=0.20", "matplotlib>=3.7", "PyYAML>=6", "requests>=2.28"]

[project.optional-dependencies]
solar = ["astropy>=5", "sunpy[map,net]>=5", "reproject>=0.10"]

[tool.setuptools.packages.find]
include = ["magnetosr*"]
