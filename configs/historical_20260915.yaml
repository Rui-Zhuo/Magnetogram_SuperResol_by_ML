train_dataset:
  dataset:
    name: paired-npz-folder
    args:
      root_path: data/paired
      split_file: data/splits/dataset_split_10115.json
      split_key: train
      split_num: 6069
      repeat: 1
      cache: in_memory
      input_key:
      - HMIfield
      - Txy
      target_key: SPfield
  wrapper:
    name: sr-asp-implicit-paired-npz
    args:
      scale: 1.56
      scale2: 1.68
      augment: true
      fixed_lr_h: 200
      fixed_lr_w: 200
  batch_size: 6
val_dataset:
  dataset:
    name: paired-npz-folder
    args:
      root_path: data/paired
      split_file: data/splits/dataset_split_10115.json
      split_key: val
      split_num: 2023
      repeat: 1
      cache: in_memory
      input_key:
      - HMIfield
      - Txy
      target_key: SPfield
  wrapper:
    name: sr-asp-implicit-paired-npz
    args:
      scale: 1.56
      scale2: 1.68
      augment: false
      fixed_lr_h: 200
      fixed_lr_w: 200
  batch_size: 6
data_norm:
  inp:
    sub:
    - 0
    div:
    - 200
  gt:
    sub:
    - 0
    div:
    - 200
model:
  name: pm-srcnn-fixed
  args:
    in_channels: 2
    hidden_channels: 64
    bottleneck_channels: 32
    target_h: 312
    target_w: 336
    use_pm: true
    distance_scale: 960.0
    pm_min: 0.5
    pm_max: 1.5
optimizer:
  name: adamW
  args:
    lr: 0.0001
seed: 42
num_workers: 4
epoch_max: 200
epoch_val: 1
epoch_save: 10
cc_weight: 0.01
loss_type: cc
loss_scales:
- 1
- 2
- 4
multi_step_lr:
  milestones:
  - 200
  - 400
  - 600
  - 800
  gamma: 0.5
resume: null
